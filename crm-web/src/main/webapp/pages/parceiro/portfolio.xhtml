<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head><title>Portfólio do Parceiro</title></h:head>
<h:body>
    <h2>Portfólio do Parceiro</h2>

    <h:dataTable value="#{parceiroPortfolioBean.ofertas}" var="oferta" border="1">
        <h:column>
            <f:facet name="header">Oferta</f:facet>
            #{oferta.nome}
        </h:column>
        <h:column>
            <f:facet name="header">Descrição</f:facet>
            #{oferta.descricao}
        </h:column>
        <h:column>
            <f:facet name="header">Cobertura</f:facet>
            #{oferta.cobertura}
        </h:column>
    </h:dataTable>
</h:body>
</html>
