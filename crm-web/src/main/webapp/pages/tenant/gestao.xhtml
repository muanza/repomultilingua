<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head><title>Gestão de Tenants</title></h:head>
<h:body>
    <h2>Gestão de Tenants</h2>

    <h:dataTable value="#{tenantGestaoBean.tenants}" var="tenant" border="1">
        <h:column>
            <f:facet name="header">Código</f:facet>
            #{tenant.codigo}
        </h:column>
        <h:column>
            <f:facet name="header">Nome</f:facet>
            #{tenant.nome}
        </h:column>
        <h:column>
            <f:facet name="header">Idioma padrão</f:facet>
            #{tenant.idiomaPadrao}
        </h:column>
        <h:column>
            <f:facet name="header">Estado</f:facet>
            #{tenant.estado}
        </h:column>
    </h:dataTable>
</h:body>
</html>
