version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: repomultilingua
      POSTGRES_USER: repomultilingua
      POSTGRES_PASSWORD: repomultilingua
    ports:
      - "5432:5432"
    volumes:
      - ../database:/docker-entrypoint-initdb.d:ro

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - db
    environment:
      APP_ENV: production
    ports:
      - "8080:8080"
